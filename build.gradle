plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.clt'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	implementation 'at.favre.lib:bcrypt:0.10.2'
	compileOnly 'org.keycloak:keycloak-core:26.2.2'
	compileOnly 'org.keycloak:keycloak-server-spi:26.2.2'
	compileOnly 'org.keycloak:keycloak-services:26.2.2'
	compileOnly 'org.keycloak:keycloak-model-storage:26.2.2'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testImplementation 'org.keycloak:keycloak-core:26.2.2'
	testImplementation 'org.keycloak:keycloak-server-spi:26.2.2'
	testImplementation 'org.keycloak:keycloak-services:26.2.2'
	testImplementation 'org.keycloak:keycloak-model-storage:26.2.2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
